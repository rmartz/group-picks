name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  # Classify the PR diff so heavy jobs can skip work that cannot affect them.
  # Default-to-run: a file is "code" unless it is provably-inert documentation,
  # so configs, lockfiles, assets and unknown types always run the suite (#332).
  # On push (not a PR) everything runs. Story-change tracking used to live here
  # for the in-repo screenshots job; that job now calls the shared
  # rmartz/storybook-ci workflow, which resolves changed stories itself.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
      agents_changed: ${{ steps.classify.outputs.agents_changed }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed files
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "agents_changed=true" >> "$GITHUB_OUTPUT"
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.sha }}"
          changed="$(git diff --name-only "$base"..."$head")"
          printf 'Changed files:\n%s\n' "$changed"

          # Inert documentation that cannot affect the build or tests. Anything
          # not matching this denylist counts as code, so the suite runs by
          # default and only provably-safe docs are skipped.
          doc_regex='(^|/)LICENSE$|\.(md|txt)$'
          if printf '%s\n' "$changed" | grep -Ev "$doc_regex" | grep -q .; then
            code_changed=true
          else
            code_changed=false
          fi

          # The agent directive-file pairing check reads only AGENTS.md /
          # CLAUDE.md files (plus its own validator), so it need only run when one
          # of those changes. A change to any such file — add, edit, rename, or
          # delete — matches and reruns the whole-tree check.
          if printf '%s\n' "$changed" | grep -Eq '(^|/)(AGENTS|CLAUDE)\.md$|^scripts/check-agents-md\.mjs$'; then
            agents_changed=true
          else
            agents_changed=false
          fi

          # The docs validator walks the whole docs/ tree (OKF frontmatter +
          # index navigability), so it need only run when a docs/ file or the
          # validator itself changes — any such change reruns the full check.
          if printf '%s\n' "$changed" | grep -Eq '^docs/|^scripts/validate-docs\.mjs$'; then
            docs_changed=true
          else
            docs_changed=false
          fi

          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
          echo "agents_changed=$agents_changed" >> "$GITHUB_OUTPUT"
          echo "docs_changed=$docs_changed" >> "$GITHUB_OUTPUT"
          printf 'Resolved: code_changed=%s agents_changed=%s docs_changed=%s\n' "$code_changed" "$agents_changed" "$docs_changed"

  tests:
    name: Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run format:check

  # Closed-input check: only AGENTS.md / CLAUDE.md files (and the validator
  # itself) can affect the result, so gate it on those changing. Enforces that
  # every AGENTS.md is paired with a companion CLAUDE.md whose only content is the
  # bare `@AGENTS.md` import — directives stay authored once, in AGENTS.md.
  agents-md:
    name: Agent directive files
    needs: detect-changes
    if: needs.detect-changes.outputs.agents_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run agents:validate

  # Closed-input check: only docs/ files (and the validator itself) can affect
  # the result, so gate it on those changing. Enforces the OKF frontmatter on
  # every docs page and that the tree is navigable from docs/index.md — every
  # page linked from its directory index, every subdirectory index from its
  # parent.
  docs:
    name: Docs
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run docs:validate

  type-check:
    name: Type Check
    needs: detect-changes
    if: needs.detect-changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm tsc

  build:
    name: Build
    needs: detect-changes
    if: needs.detect-changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
