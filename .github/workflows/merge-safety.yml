name: merge-safety

# Posts the `merge-safety` check-run (base-currency / breaking-change / conflict
# verdict) for a PR and re-holds every open PR when `main` moves, so a PR only
# auto-merges once it is safe against the current base. The check-run name is a
# fleet contract — require the status check named exactly `merge-safety` on the
# default branch. Reusable workflow, SHA-pinned and Dependabot-maintained.
on:
  # pull_request_target (not pull_request) so the check still fires on an unmergeable
  # PR — GitHub cannot build the refs/pull/N/merge commit a pull_request run checks
  # out, so a required merge-safety check would hang forever on a conflicting PR
  # (rmartz/ai-tools#272).
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  # Re-hold / release open PRs when the base branch's own CI flips red/green.
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate
        required: true

permissions:
  checks: write
  pull-requests: write
  contents: read
  actions: write
  packages: read

jobs:
  merge-safety:
    uses: rmartz/merge-safety/.github/workflows/merge-safety.yml@db145fb8c20164185eb9e1a1c237dc4d9085c69f # v0.1.0
    with:
      pr: ${{ inputs.pr }}
    secrets: inherit
