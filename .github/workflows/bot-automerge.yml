name: bot-automerge

# Enables GitHub-native auto-merge for trusted bot PRs (Dependabot patch/minor
# bumps; release-please release PRs) via the bot-automerge-action composite
# Action. It posts no check-run — it only makes an eligible bot PR auto-merge,
# and the repo's required checks (CI gates + merge-safety) are what it waits on.
# Safe only because merge-safety and the CI gates are required on the default
# branch. Triggers on pull_request_target because enabling auto-merge on a
# Dependabot PR needs base-context write. SHA-pinned, Dependabot-maintained.
#
# Auto-merge is enabled with an installation token for the rmartz-merge-bot
# GitHub App, not the built-in github.token: a merge enabled with GITHUB_TOKEN
# fires no push workflows, so a bot merge would reach main with no CI or deploy
# run. App-authored events do trigger them, and the App has its own rate-limit
# pool, separate from the user's.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  bot-automerge:
    # Skip the job outright on PRs the CLI could never trust, so a human PR shows a
    # free `skipped` instead of checking out and installing the CLI just to no-op.
    # The two conditions mirror the CLI's own detectBotPrType exactly —
    # Dependabot by author, release-please by head branch prefix — so nothing
    # eligible is skipped. The `autorelease: pending` label is not a signal: since
    # v2.0.0 the CLI ignores it, because anyone with triage permission can apply it
    # (rmartz/bot-automerge#41).
    # It is deliberately not an author test: a release PR is authored by
    # whichever identity release-please runs under (a bot App or a real user),
    # so its author is not predictable and an author-only guard could skip
    # release PRs. The head branch prefix is the stable signal.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      || startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The App's Client ID and private key are stored as both Actions and
      # Dependabot secrets (a Dependabot-triggered run sees only the latter).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.MERGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_BOT_PRIVATE_KEY }}
      - uses: rmartz/bot-automerge-action@093d999beb473766da21ef872c82d15a07595c14 # v2.1.7
        with:
          pr: ${{ github.event.pull_request.number }}
          # Installation token for the rmartz-merge-bot GitHub App, never
          # GITHUB_TOKEN. An auto-merge enabled with GITHUB_TOKEN fires no push
          # workflows, so a bot merge would reach main with no push-triggered CI,
          # release, or merge-safety run (rmartz/bot-automerge-action#31).
          # App-authored events do trigger them, and the App has its own
          # rate-limit pool, separate from the user's. The token step fails
          # closed if the App secrets are missing.
          token: ${{ steps.app-token.outputs.token }}
