name: Storybook Tests

# Thin caller for the shared rmartz/storybook-ci reusable workflow. The
# operational reasoning this repo used to carry by hand — Chromium provisioning
# and binary caching with an apt-retry, docs-only change gating, fail-vs-cancel
# budgeting — now lives upstream once, so a fix there reaches us through a
# Dependabot pin bump instead of an edit here.
#
# Deliberately NO `on.paths`: gating is the shared workflow's `detect-changes`
# job plus its per-job `if:`. `Storybook Tests` is a required check on the
# default branch, and a required check that never runs because its paths did not
# match hangs the PR forever; a *skipped* job, by contrast, counts as passing.
#
# The check context this reports is `storybook-tests / Storybook Tests`, not the
# bare `Storybook Tests` the in-repo job used — the default-branch ruleset's
# required check must be renamed to match. See docs/storybook-ci.md.

on:
  pull_request:
  push:
    branches: [main]

# A caller's `permissions:` block is exhaustive and a called workflow can only
# narrow it. The shared workflow declares `packages: read` (so a consumer's
# scoped .npmrc can resolve GitHub Packages); it is inert here but must be
# granted, or the called jobs would request a scope the caller withheld.
permissions:
  contents: read
  packages: read

jobs:
  storybook-tests:
    # The shared build job (`storybook-tests / Storybook Build`) builds Storybook
    # and then renders canary Redux-connected stories from the built bundle
    # (scripts/check-storybook-render.mjs) to guard the Vite 8 / Rolldown
    # reselect tree-shaking regression (#381) — a render break that neither a
    # compile-only build nor the vitest story suite (dev transform) catches.
    # `build-needs-browser` provisions the same cached Playwright Chromium the
    # test job uses, at the default ~/.cache/ms-playwright path the script's
    # `playwright` import launches from. Tests run on the shared default: `pnpm
    # exec vitest run --project storybook` resolves against our `storybook`
    # vitest project.
    uses: rmartz/storybook-ci/.github/workflows/storybook-tests.yml@ff758949491f6d22298273b424dd79144c5dd543 # v1.5.2
    with:
      build-needs-browser: true
      build-command: pnpm build-storybook && node scripts/check-storybook-render.mjs
