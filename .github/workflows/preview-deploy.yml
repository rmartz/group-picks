name: Preview Deploy

# Vercel preview deploy via the shared rmartz/vercel-preview-ci reusable
# workflow (#499, originally #351). A PR gets a preview when its title has a
# functional Conventional Commit type (`feat`, `fix`, `perf`, `revert`) or it
# carries the `preview` label; a `no preview` or `do not merge` label skips it.
# It is redeployed on each new push, and the URL is posted as a sticky PR
# comment. `opened` and `edited` are triggers so a new functional PR, or a PR
# retitled to a functional type, deploys without waiting for a push. The gate,
# fork safety, and per-PR concurrency live in the shared workflow:
# https://github.com/rmartz/vercel-preview-ci/blob/main/docs/consuming.md
#
# This is the sole preview path: vercel.json's `git.deploymentEnabled` disables
# Vercel's Git-integration deploys for every branch except `main`.
#
# Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  preview:
    uses: rmartz/vercel-preview-ci/.github/workflows/vercel-preview.yml@42ebca3257dc76755982bcde196c0524bc4b9657 # v3.0.1
    with:
      node-version: 26.x
    secrets: inherit
