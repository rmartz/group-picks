version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # NOTE: Do NOT add a `cooldown` here. Dependabot enforces an npm cooldown by
    # passing pnpm a `minimumReleaseAge` during lockfile regeneration; whenever any
    # transitive dep in the fast-moving Storybook/Vite toolchain (e.g. `terser`) has
    # a release inside the window, pnpm hard-fails with
    # ERR_PNPM_NO_MATURE_MATCHING_VERSION instead of falling back to an older mature
    # version. That breaks the whole grouped run, so every dependency fails and the
    # PR is closed as `update_no_longer_possible` — silently starving the repo of
    # security updates. A lockfile-freshness cooldown cannot coexist with Dependabot
    # always resolving to latest, so no explicit cooldown is declared for this
    # ecosystem. (Since 2026-07-14 Dependabot applies a 3-day default wait even
    # with no `cooldown` configured; this repo has no `@rmartz/*` npm deps to
    # exempt from it.)
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group only minor and patch bumps into one PR per dependency type. Major
    # bumps match no group and are raised as individual PRs, since they are the
    # most likely to need a code change and warrant isolated review.
    groups:
      # Version-locked families — packages whose versions move together, so a
      # major to one is broken without the rest (a `react` major without
      # `react-dom`, one `@storybook/*` without the others). Listed first, and
      # ordered so first-match precedence resolves the overlaps: storybook before
      # eslint (catches `eslint-plugin-storybook`) and before vite (catches
      # `@storybook/*-vite*`).
      #
      # Same-scope families (all dev, or all prod) restrict to `major`: their
      # minor/patch bumps already move in lockstep inside the dev-dependencies /
      # production-dependencies catch-alls below, so a major is the only bump the
      # catch-alls exclude — i.e. the only case that would fragment the family
      # into standalone PRs. Restricting to `major` keeps majors atomic while
      # letting minor/patch rejoin the big weekly batch (fewer PRs). Only react
      # *crosses* dev↔prod, so it keeps all update-types (see its note).
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
          - "eslint-plugin-storybook"
        update-types:
          - "major"
      react:
        # Unrestricted (major + minor + patch): react spans prod (`react`,
        # `react-dom`) and dev (`@types/react*`), so its minor/patch would
        # otherwise scatter across the two catch-alls instead of staying atomic.
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/js"
          - "typescript-eslint"
          - "eslint-plugin-react-hooks"
          - "eslint-plugin-simple-import-sort"
        update-types:
          - "major"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "major"
      # NOTE: the `prettier` and `typescript` risk-isolation groups were removed
      # (#479) as a deliberate A/B experiment. Both were isolated on the
      # *assumption* that their minor bumps are more likely to force a code
      # change, but a full audit of Dependabot history found neither had ever
      # caught a real breakage (each fired only once — a superseded prettier PR
      # and a still-open typescript major). With the groups gone, prettier and
      # typescript minor bumps rejoin the dev-dependencies batch and their majors
      # surface as individual PRs — like any other package — so
      # `scripts/dependabot-audit.mjs` can measure whether they actually fail at a
      # higher rate than the baseline. Restore a group here only if the audit
      # shows it earns one. See docs/dependabot-grouping.md.
      dev-dependencies:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      production-dependencies:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Cooldown: since 2026-07-14 Dependabot waits 3 days after a release before
    # proposing it, even with no `cooldown` configured. Third-party actions keep
    # that default; SHA pinning (enforced by repo-hygiene's `action-pins` check)
    # remains the primary supply-chain control. Only first-party `rmartz/*`
    # actions and reusable workflows are exempt: they're published from our own
    # repos with provenance, so the wait adds no protection and only holds fixes
    # back from the fleet.
    cooldown:
      # Explicit, so declaring the block can't change the third-party default.
      default-days: 3
      exclude:
        - "rmartz/*"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Every action bump, majors included, lands in one PR (unlike the npm groups
    # above, where majors are individual). bot-automerge holds a group containing
    # a major for human review (fetch-metadata reports the group's highest
    # update-type), and a major that breaks CI is split out into its own fix PR
    # rather than holding the rest of the group back.
    groups:
      github-actions:
        patterns:
          - "*"
