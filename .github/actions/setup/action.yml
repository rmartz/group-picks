name: "Setup"
description: "Install pnpm, Node.js, and project dependencies"

# Browser-free by design: every job that needs a Playwright browser (Storybook
# tests, the built-bundle render canary, screenshots) runs in the shared
# rmartz/storybook-ci reusable workflows, which provision and cache Chromium
# themselves. See docs/storybook-ci.md.

inputs:
  frozen-lockfile:
    description: "Use --frozen-lockfile for pnpm install"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      shell: bash
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24.x
        cache: "pnpm"
    - run: pnpm install ${{ inputs.frozen-lockfile == 'true' && '--frozen-lockfile' || '--no-frozen-lockfile' }}
      shell: bash
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
